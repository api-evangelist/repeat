aid: repeat
name: Repeat
description: >-
  Repeat is a lifecycle and retention marketing platform for consumer packaged
  goods (CPG) and e-commerce brands, now operated as a product of Stamped. It
  connects to a brand's Shopify store to ingest historical and incoming orders,
  predicts replenishment and reorder "Moments" for each customer, and automates
  personalized post-purchase campaigns across email, SMS, and direct mail.
  Repeat surfaces product predictions as reusable components inside Klaviyo,
  Postscript, and Attentive flows, and generates events that enrich customer
  profiles for segmentation and personalization. Founded in 2018 in Venice,
  California by Kim Stiefel and Sarah Wissel and backed by Battery Ventures and
  Techstars, Repeat is documented through a customer-facing Help Center rather
  than a public developer API or portal.
