note: >-
  No /.well-known/ document is served by a host Repeat controls. Three distinct
  failure modes were observed and are recorded separately below, because they are
  different facts. (1) getrepeat.io — the marketing site, served by Super.so on top
  of Notion — returns a clean 404 on every path. (2) docs.getrepeat.io — a CNAME to
  us.intercomhelpcenter.com — returns a real 200 security.txt, but the document is
  INTERCOM'S, not Repeat's: it names Contact mailto:security@intercom.com, the
  Bugcrowd program bugcrowd.com/intercom, and Canonical
  https://app.intercom.com/.well-known/security.txt. It is the docs-platform vendor's
  disclosure policy leaking through a customer subdomain, so it is recorded as a
  third-party hit and NOT credited to Repeat. (3) app.getrepeat.io — a Netlify SPA
  (repeat-northstar.netlify.app) — answers HTTP 200 with the same 4,488-byte HTML
  application shell for EVERY path, including /openapi.json, /graphql and
  /.well-known/agent-card.json. Those 200s are catch-all false positives, not
  documents. No WellKnown or SecurityTxt pointer is emitted for this provider.
